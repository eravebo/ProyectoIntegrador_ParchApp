# =========================================================
# ParchApp - Configuración principal
# Archivo: src/main/resources/application.properties
# =========================================================

# --- Base de datos ---
# Cambia los valores de usuario y contraseña según tu entorno local
spring.datasource.url=jdbc:mysql://localhost:3306/parchapp_db?useSSL=false&serverTimezone=America/Bogota&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=tu_contraseña_aqui
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# --- JPA / Hibernate ---
# validate: verifica que el esquema SQL coincida con las entidades (recomendado en producción)
# update:   crea/modifica tablas automáticamente (útil en desarrollo, NO usar en producción)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# --- Servidor ---
server.port=8080

# --- Nombre de la app ---
spring.application.name=parchapp-backend

# =========================================================
# NOTA: Para desarrollo puedes cambiar ddl-auto a "update"
# así Hibernate crea las tablas si no existen.
# Pero lo recomendado es ejecutar primero el script SQL
# que está en: src/main/resources/schema.sql
# =========================================================
